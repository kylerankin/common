name: Common issue policy preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/issue-policy.json'
      - '.github/prow.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issue-lifecycle.yml'
      - '.github/workflows/issue-policy-preview.yml'
  workflow_dispatch:
    inputs:
      runtime-ref:
        description: First-party Actions candidate ref for read-only preview; production uses v1
        type: string
        # Pinned to the same commit the reusable workflow file is pinned to
        # (reusable-issue-policy-preview.yml@48a0112). The workflow file SHA pin
        # only pins the caller; without this the executed issue-lifecycle code
        # still floats on the mutable v1 tag (common#1389).
        default: 48a0112c6293d00357eef0ef3a4ce2e54dbdd94a # v1
      caller-ref:
        description: Reviewed caller data commit; empty uses event revision
        type: string
        default: ''
      issue:
        description: Optional issue or PR number
        type: string
        default: ''
      migrate:
        description: Include all closed issue and PR label history
        type: boolean
        default: true

permissions: {}

jobs:
  preview:
    if: github.repository == 'projectbluefin/common'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: projectbluefin/actions/.github/workflows/reusable-issue-policy-preview.yml@48a0112c6293d00357eef0ef3a4ce2e54dbdd94a # v1
    with:
      runtime-ref: ${{ inputs['runtime-ref'] || '48a0112c6293d00357eef0ef3a4ce2e54dbdd94a' }} # v1
      caller-ref: ${{ inputs['caller-ref'] || github.event.pull_request.head.sha || github.sha }}
      issue: ${{ inputs.issue || '' }}
      migrate: ${{ github.event_name == 'pull_request' || inputs.migrate }}

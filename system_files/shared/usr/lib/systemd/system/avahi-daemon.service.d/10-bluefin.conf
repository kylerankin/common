# Drop-in for avahi-daemon.service — projectbluefin/common#1327
#
# Symptom on Utah (and any image that inherits this shared layer):
#
#   avahi-daemon[...]: Found user 'avahi' (UID 70) and group 'avahi' (GID 70).
#   avahi-daemon[...]: Successfully dropped root privileges.
#   avahi-daemon[...]: open(/run/avahi-daemon//pid): Permission denied
#   avahi-daemon[...]: Failed to create PID file: Permission denied
#   systemd[1]: Failed to start avahi-daemon.service - Avahi mDNS/DNS-SD Stack.
#
# Root cause: the daemon drops to the unprivileged avahi user and then cannot
# create its PID file at /run/avahi-daemon/pid because that directory is not
# owned by avahi. The stock avahi-daemon.service neither owns its runtime
# directory (it relies on systemd-tmpfiles from /usr/lib/tmpfiles.d/avahi.conf)
# nor sets User= — it drops privileges itself — so on this image /run/avahi-
# daemon is not guaranteed to be avahi's when the service starts, and the daemon
# is denied when it writes the pid file after dropping root.
#
# Declaring RuntimeDirectory=avahi-daemon makes systemd create /run/avahi-daemon
# and reset its owner/mode on every start. Because the service runs as root (no
# User=), we pin RuntimeDirectoryUser/Group to avahi so systemd chowns the
# directory to the user the daemon actually drops to; mode 0755 lets avahi write
# its pid file. systemd also repairs a pre-existing wrongly root-owned directory,
# so this fixes the failing case, not only a missing one.
[Service]
RuntimeDirectory=avahi-daemon
RuntimeDirectoryUser=avahi
RuntimeDirectoryGroup=avahi
RuntimeDirectoryMode=0755
